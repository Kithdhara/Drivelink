<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="favHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93152c"/>
      <stop offset="100%" stop-color="#3c060f"/>
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="60%" stop-color="#d49b28"/>
      <stop offset="100%" stop-color="#8a5a0f"/>
    </linearGradient>
  </defs>

  <!-- Outer Cog Rim -->
  <circle cx="32" cy="32" r="30" fill="#081524" stroke="url(#favGold)" stroke-width="2.5"/>

  <!-- Steering Wheel Rim -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#favGold)" stroke-width="3"/>

  <!-- Steering Spokes -->
  <line x1="10" y1="32" x2="22" y2="32" stroke="url(#favGold)" stroke-width="2.5"/>
  <line x1="42" y1="32" x2="54" y2="32" stroke="url(#favGold)" stroke-width="2.5"/>
  <line x1="32" y1="42" x2="32" y2="54" stroke="url(#favGold)" stroke-width="2.5"/>

  <!-- Center Maroon Lion Medallion -->
  <circle cx="32" cy="32" r="11" fill="url(#favHub)" stroke="url(#favGold)" stroke-width="1.2"/>

  <!-- Lion Silhouette -->
  <path
    d="M29 27 C30 25 33 25 34 26 C36 28 35 30 33 30 C32 32 30 32 28 31 C27 29 28 27 29 27 Z"
    fill="url(#favGold)"
  />
  <!-- Sword Upright -->
  <path d="M35 23 L36 21 L37 22 L36 29 L35 29 Z" fill="#ffffff"/>
  <!-- Torso & Tail -->
  <path d="M28 30 C30 31 31 34 30 37 C28 38 26 36 27 32 Z" fill="url(#favGold)"/>
  <path d="M26 34 C24 31 25 28 27 27" stroke="url(#favGold)" stroke-width="0.8" fill="none"/>
</svg>
