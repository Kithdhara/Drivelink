<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320" fill="none">
  <defs>
    <!-- Studio Lighting Background -->
    <radialGradient id="studioBg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Skin Base & Shading -->
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d49a6a"/>
      <stop offset="45%" stop-color="#c58350"/>
      <stop offset="100%" stop-color="#a86535"/>
    </linearGradient>

    <linearGradient id="neckShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d4f24"/>
      <stop offset="100%" stop-color="#b67441"/>
    </linearGradient>

    <!-- Hair Tone -->
    <linearGradient id="hairTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221e1d"/>
      <stop offset="50%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#090706"/>
    </linearGradient>

    <!-- Shirt Tone -->
    <linearGradient id="shirtTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Holographic Ghost Watermark on Photo -->
    <linearGradient id="holoGhost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="240" height="320" fill="url(#studioBg)"/>

  <!-- Shoulders / Torso / Dark Collared Shirt -->
  <g id="clothing">
    <!-- Outer Shirt -->
    <path d="M 12 320 C 18 260, 48 225, 86 215 L 120 230 L 154 215 C 192 225, 222 260, 228 320 Z" fill="url(#shirtTone)"/>
    
    <!-- White Inner Undershirt / T-shirt at Neck -->
    <path d="M 104 220 C 104 220, 120 232, 136 220 L 130 248 L 110 248 Z" fill="#f8fafc"/>
    
    <!-- Shirt Collar Left -->
    <path d="M 86 215 L 112 252 L 102 245 L 82 225 Z" fill="#334155"/>
    <!-- Shirt Collar Right -->
    <path d="M 154 215 L 128 252 L 138 245 L 158 225 Z" fill="#1e293b"/>
    <!-- Front Placket & Buttons -->
    <line x1="120" y1="248" x2="120" y2="320" stroke="#090d16" stroke-width="2"/>
    <circle cx="120" cy="270" r="2.5" fill="#64748b"/>
    <circle cx="120" cy="300" r="2.5" fill="#64748b"/>
  </g>

  <!-- Neck -->
  <path d="M 96 170 L 96 226 C 108 234, 132 234, 144 226 L 144 170 Z" fill="url(#neckShadow)"/>

  <!-- Ears -->
  <g id="ears">
    <!-- Left Ear -->
    <ellipse cx="64" cy="142" rx="9" ry="17" fill="#b67341" transform="rotate(-6 64 142)"/>
    <ellipse cx="64" cy="142" rx="5" ry="11" fill="#915226" transform="rotate(-6 64 142)"/>
    <!-- Right Ear -->
    <ellipse cx="176" cy="142" rx="9" ry="17" fill="#b67341" transform="rotate(6 176 142)"/>
    <ellipse cx="176" cy="142" rx="5" ry="11" fill="#915226" transform="rotate(6 176 142)"/>
  </g>

  <!-- Head / Face Oval -->
  <path d="M 68 120 C 68 62, 172 62, 172 120 C 172 165, 148 196, 120 196 C 92 196, 68 165, 68 120 Z" fill="url(#skinTone)"/>

  <!-- Face Highlights & Cheeks -->
  <ellipse cx="120" cy="125" rx="34" ry="42" fill="#d99f70" opacity="0.45"/>
  <ellipse cx="120" cy="98" rx="26" ry="14" fill="#dfa677" opacity="0.5"/>

  <!-- Hair -->
  <g id="hair">
    <!-- Main Hair Volume -->
    <path d="M 62 110 C 60 52, 90 32, 120 32 C 152 32, 180 52, 178 110 C 174 92, 168 76, 148 70 C 128 64, 102 66, 84 78 C 72 86, 66 98, 62 110 Z" fill="url(#hairTone)"/>
    <!-- Sideburns -->
    <path d="M 66 105 L 68 136 L 74 130 L 73 105 Z" fill="#141110"/>
    <path d="M 174 105 L 172 136 L 166 130 L 167 105 Z" fill="#141110"/>
    <!-- Top Hair Sheen/Texture -->
    <path d="M 94 48 C 110 40, 136 40, 150 50 C 140 45, 116 44, 94 48 Z" fill="#383331" opacity="0.6"/>
  </g>

  <!-- Eyebrows -->
  <g id="eyebrows">
    <path d="M 82 112 Q 97 106, 108 111" stroke="#191514" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 158 112 Q 143 106, 132 111" stroke="#191514" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Eyes -->
  <g id="eyes">
    <!-- Left Eye -->
    <path d="M 84 125 Q 96 118, 108 125 Q 96 132, 84 125 Z" fill="#ffffff"/>
    <circle cx="96" cy="125" r="5" fill="#2d1c13"/>
    <circle cx="96" cy="125" r="2.8" fill="#000000"/>
    <circle cx="97.5" cy="123.5" r="1.2" fill="#ffffff"/>
    <!-- Left Eyelid crease -->
    <path d="M 85 120 Q 96 116, 107 120" stroke="#8d4f24" stroke-width="1.2" fill="none" opacity="0.6"/>

    <!-- Right Eye -->
    <path d="M 132 125 Q 144 118, 156 125 Q 144 132, 132 125 Z" fill="#ffffff"/>
    <circle cx="144" cy="125" r="5" fill="#2d1c13"/>
    <circle cx="144" cy="125" r="2.8" fill="#000000"/>
    <circle cx="145.5" cy="123.5" r="1.2" fill="#ffffff"/>
    <!-- Right Eyelid crease -->
    <path d="M 133 120 Q 144 116, 155 120" stroke="#8d4f24" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>

  <!-- Nose -->
  <g id="nose">
    <path d="M 120 118 L 118 148 L 114 153 Q 120 156, 126 153 L 122 148 Z" fill="#b97645" opacity="0.4"/>
    <path d="M 113 151 Q 120 156, 127 151" stroke="#82431a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <circle cx="111" cy="151" r="1.8" fill="#753913" opacity="0.6"/>
    <circle cx="129" cy="151" r="1.8" fill="#753913" opacity="0.6"/>
  </g>

  <!-- Mouth -->
  <g id="mouth">
    <path d="M 104 172 Q 120 178, 136 172" stroke="#75361b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 107 172 Q 120 181, 133 172" fill="#a45431" opacity="0.6"/>
    <!-- Under lip shadow -->
    <path d="M 112 183 Q 120 186, 128 183" stroke="#8d4f24" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>

  <!-- Security Holographic Biometric Ghost Overlay (Official Seal on Photo) -->
  <g transform="translate(135, 210)" opacity="0.75">
    <circle cx="45" cy="45" r="40" fill="url(#holoGhost)" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <circle cx="45" cy="45" r="32" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="3 3"/>
    <circle cx="45" cy="45" r="22" fill="none" stroke="#ffffff" stroke-width="0.7"/>
    <text x="45" y="42" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">DMT</text>
    <text x="45" y="52" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SRI LANKA</text>
  </g>

  <!-- Fine Outer Photo Border -->
  <rect x="0.5" y="0.5" width="239" height="319" fill="none" stroke="#cbd5e1" stroke-width="1"/>
</svg>
