<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1c33"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="220" fill="url(#skyGrad)"/>
  
  <!-- Modern Test Track Lights -->
  <line x1="120" y1="80" x2="120" y2="220" stroke="#64748b" stroke-width="3"/>
  <circle cx="120" cy="80" r="10" fill="#f5ce62" filter="drop-shadow(0 0 10px #f5ce62)"/>
  <line x1="480" y1="80" x2="480" y2="220" stroke="#64748b" stroke-width="3"/>
  <circle cx="480" cy="80" r="10" fill="#f5ce62" filter="drop-shadow(0 0 10px #f5ce62)"/>

  <!-- Test Track Asphalt Surface -->
  <path d="M 0 220 L 600 220 L 600 400 L 0 400 Z" fill="url(#asphalt)"/>

  <!-- Track Curbs (Red & White Racing/Safety Curbs) -->
  <g transform="translate(0, 218)">
    <rect x="0" y="0" width="60" height="8" fill="#e11d48"/>
    <rect x="60" y="0" width="60" height="8" fill="#ffffff"/>
    <rect x="120" y="0" width="60" height="8" fill="#e11d48"/>
    <rect x="180" y="0" width="60" height="8" fill="#ffffff"/>
    <rect x="240" y="0" width="60" height="8" fill="#e11d48"/>
    <rect x="300" y="0" width="60" height="8" fill="#ffffff"/>
    <rect x="360" y="0" width="60" height="8" fill="#e11d48"/>
    <rect x="420" y="0" width="60" height="8" fill="#ffffff"/>
    <rect x="480" y="0" width="60" height="8" fill="#e11d48"/>
    <rect x="540" y="0" width="60" height="8" fill="#ffffff"/>
  </g>

  <!-- Track Road Markings -->
  <path d="M 50 360 C 200 360, 300 280, 550 280" fill="none" stroke="#f5ce62" stroke-width="5" stroke-dasharray="16 12"/>
  <path d="M 20 400 C 180 390, 320 310, 580 310" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

  <!-- Traffic / Trial Cones -->
  <g transform="translate(140, 290)">
    <path d="M 12 0 L 0 35 L 24 35 Z" fill="#f97316"/>
    <rect x="3" y="14" width="18" height="6" fill="#ffffff"/>
    <rect x="-4" y="34" width="32" height="5" rx="2" fill="#ea580c"/>
  </g>
  <g transform="translate(260, 270)">
    <path d="M 10 0 L 0 28 L 20 28 Z" fill="#f97316"/>
    <rect x="3" y="11" width="14" height="5" fill="#ffffff"/>
    <rect x="-3" y="27" width="26" height="4" rx="2" fill="#ea580c"/>
  </g>

  <!-- Training / Trial Test Car (Right Center) -->
  <g transform="translate(320, 230)">
    <!-- Car Shadow -->
    <ellipse cx="110" cy="115" rx="105" ry="18" fill="#000000" opacity="0.5"/>
    
    <!-- Car Body -->
    <path d="M 20 90 Q 20 65, 50 65 L 85 45 Q 110 32, 145 32 L 180 48 Q 205 60, 215 90 L 210 105 L 15 105 Z" fill="url(#carRed)"/>
    
    <!-- Windows -->
    <path d="M 85 48 L 130 38 L 130 65 L 65 65 Z" fill="#0b1c33" opacity="0.85"/>
    <path d="M 136 38 L 175 48 L 195 65 L 136 65 Z" fill="#0b1c33" opacity="0.85"/>
    
    <!-- L-Plate on Roof -->
    <rect x="115" y="12" width="30" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="130" y="30" font-family="sans-serif" font-size="18" font-weight="900" fill="#e11d48" text-anchor="middle">L</text>
    <line x1="130" y1="36" x2="130" y2="40" stroke="#475569" stroke-width="2"/>

    <!-- Headlights & Taillights -->
    <path d="M 205 85 Q 215 88, 215 95 L 202 95 Z" fill="#fef08a" filter="drop-shadow(4px 0 8px #fef08a)"/>
    <rect x="15" y="85" width="6" height="12" rx="2" fill="#fda4af"/>

    <!-- Wheels -->
    <circle cx="65" cy="105" r="20" fill="#0f172a"/>
    <circle cx="65" cy="105" r="12" fill="#64748b"/>
    <circle cx="65" cy="105" r="5" fill="#e2e8f0"/>

    <circle cx="175" cy="105" r="20" fill="#0f172a"/>
    <circle cx="175" cy="105" r="12" fill="#64748b"/>
    <circle cx="175" cy="105" r="5" fill="#e2e8f0"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="34" rx="17" fill="#0b1c33" fill-opacity="0.85" stroke="#c6a15b" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="7" fill="#f5ce62"/>
    <text x="35" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Practical Driving Trials</text>
  </g>
</svg>
