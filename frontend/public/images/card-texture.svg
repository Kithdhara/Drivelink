<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" fill="none">
  <defs>
    <!-- Deep Navy Luxury Card Gradient -->
    <linearGradient id="blueCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163456"/>
      <stop offset="40%" stop-color="#0e233d"/>
      <stop offset="80%" stop-color="#081628"/>
      <stop offset="100%" stop-color="#040b15"/>
    </linearGradient>

    <!-- Gold Guilloche Gradient -->
    <linearGradient id="goldLace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c6a15b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#916f2b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Luminous Teal / Cyan Security Ribbon -->
    <linearGradient id="cyanLace" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0e7c7b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Security Micro-Sine Waves Pattern -->
    <pattern id="secGrid" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 10 0, 20 10 T 40 10" fill="none" stroke="#c6a15b" stroke-width="0.5" opacity="0.14"/>
      <path d="M 0 15 Q 10 5, 20 15 T 40 15" fill="none" stroke="#38bdf8" stroke-width="0.35" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Deep Blue Card Base -->
  <rect width="600" height="380" rx="20" fill="url(#blueCardBg)"/>

  <!-- Micro Wave Security Grid -->
  <rect width="600" height="380" rx="20" fill="url(#secGrid)"/>

  <!-- Left Lotus Rosette Guilloche (Nelum Petals Watermark) -->
  <g transform="translate(100, 260)" opacity="0.85">
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#goldLace)" stroke-width="1"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#cyanLace)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <!-- Petals -->
    <path d="M0 -95 C25 -55, 25 -25, 0 0 C-25 -25, -25 -55, 0 -95 Z" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <path d="M95 0 C55 25, 25 25, 0 0 C25 -25, 55 -25, 95 0 Z" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <path d="M0 95 C-25 55, -25 25, 0 0 C25 25, 25 55, 0 95 Z" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <path d="M-95 0 C-55 -25, -25 -25, 0 0 C-25 25, -55 25, -95 0 Z" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <!-- 45-degree petals -->
    <g transform="rotate(45)">
      <path d="M0 -95 C25 -55, 25 -25, 0 0 C-25 -25, -25 -55, 0 -95 Z" fill="none" stroke="url(#cyanLace)" stroke-width="0.8"/>
      <path d="M95 0 C55 25, 25 25, 0 0 C25 -25, 55 -25, 95 0 Z" fill="none" stroke="url(#cyanLace)" stroke-width="0.8"/>
      <path d="M0 95 C-25 55, -25 25, 0 0 C25 25, 25 55, 0 95 Z" fill="none" stroke="url(#cyanLace)" stroke-width="0.8"/>
      <path d="M-95 0 C-55 -25, -25 -25, 0 0 C-25 25, -55 25, -95 0 Z" fill="none" stroke="url(#cyanLace)" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Large Right Sunburst Mandala Watermark -->
  <g transform="translate(420, 150)" opacity="0.75">
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#goldLace)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="125" fill="none" stroke="url(#goldLace)" stroke-width="1"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#cyanLace)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#goldLace)" stroke-width="0.8"/>
    <g transform="rotate(30)"><circle cx="0" cy="0" r="115" fill="none" stroke="url(#goldLace)" stroke-width="0.6" stroke-dasharray="4 4"/></g>
    <g transform="rotate(60)"><circle cx="0" cy="0" r="85" fill="none" stroke="url(#cyanLace)" stroke-width="0.6" stroke-dasharray="3 3"/></g>
  </g>

  <!-- Sweeping Gold & Teal Guilloche Sine Wave Ribbons -->
  <path d="M 0 60 Q 150 90, 300 60 T 600 60" fill="none" stroke="url(#goldLace)" stroke-width="0.9" opacity="0.6"/>
  <path d="M 0 75 Q 150 35, 300 75 T 600 75" fill="none" stroke="url(#cyanLace)" stroke-width="0.8" opacity="0.5"/>
  <path d="M 0 200 Q 150 240, 300 200 T 600 200" fill="none" stroke="url(#goldLace)" stroke-width="0.9" opacity="0.55"/>
  <path d="M 0 320 Q 150 350, 300 320 T 600 320" fill="none" stroke="url(#cyanLace)" stroke-width="0.8" opacity="0.6"/>

  <!-- Fine Outer Edge Glow Border -->
  <rect x="3" y="3" width="594" height="374" rx="17" fill="none" stroke="url(#goldLace)" stroke-width="1.2" opacity="0.4"/>
</svg>
