<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="hallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c33"/>
      <stop offset="50%" stop-color="#16304f"/>
      <stop offset="100%" stop-color="#0e2338"/>
    </linearGradient>
    <linearGradient id="glassCounter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Hall Background -->
  <rect width="600" height="400" fill="url(#hallBg)"/>

  <!-- Ceiling LED Recessed Light Strips -->
  <line x1="100" y1="0" x2="160" y2="120" stroke="#38bdf8" stroke-width="4" opacity="0.6" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <line x1="300" y1="0" x2="300" y2="120" stroke="#f5ce62" stroke-width="4" opacity="0.6" filter="drop-shadow(0 0 8px #f5ce62)"/>
  <line x1="500" y1="0" x2="440" y2="120" stroke="#38bdf8" stroke-width="4" opacity="0.6" filter="drop-shadow(0 0 8px #38bdf8)"/>

  <!-- Digital Queue Status Billboard Wall -->
  <g transform="translate(180, 50)">
    <rect width="240" height="80" rx="8" fill="#030712" stroke="#c6a15b" stroke-width="1.5"/>
    <text x="120" y="28" font-family="sans-serif" font-size="11" font-weight="900" fill="#f5ce62" text-anchor="middle" letter-spacing="2">SMART SERVICE COUNTER</text>
    <line x1="20" y1="36" x2="220" y2="36" stroke="#c6a15b" stroke-width="0.8" opacity="0.4"/>
    <text x="40" y="56" font-family="sans-serif" font-size="9" fill="#94a3b8">NOW SERVING</text>
    <text x="40" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#22c55e">TOKEN #142</text>
    <text x="160" y="56" font-family="sans-serif" font-size="9" fill="#94a3b8">EST. WAIT</text>
    <text x="160" y="72" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">03 MINS</text>
  </g>

  <!-- Modern Reception Service Desk / Counter -->
  <g transform="translate(50, 210)">
    <!-- Main Desk Block -->
    <path d="M 30 50 L 470 50 L 500 190 L 0 190 Z" fill="url(#glassCounter)" stroke="#475569" stroke-width="1.5"/>
    <!-- Gold LED Counter Strip -->
    <line x1="20" y1="65" x2="480" y2="65" stroke="#c6a15b" stroke-width="3" filter="drop-shadow(0 0 6px #c6a15b)"/>
    <!-- Biometric Fingerprint Scanner on Counter -->
    <rect x="120" y="32" width="28" height="20" rx="3" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
    <circle cx="134" cy="42" r="5" fill="#38bdf8" opacity="0.6"/>
    <!-- Card Dispenser Terminal -->
    <rect x="340" y="20" width="45" height="32" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
    <line x1="348" y1="42" x2="377" y2="42" stroke="#22c55e" stroke-width="2"/>
    <rect x="352" y="34" width="20" height="12" rx="2" fill="#c6a15b" opacity="0.8"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(40, 40)">
    <rect width="210" height="34" rx="17" fill="#0b1c33" fill-opacity="0.85" stroke="#c6a15b" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="7" fill="#38bdf8"/>
    <text x="35" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">One-Day Express Issuance</text>
  </g>
</svg>
