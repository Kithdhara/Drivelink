<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <defs>
    <!-- Cinematic Twilight Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="35%" stop-color="#0b1c33"/>
      <stop offset="65%" stop-color="#163456"/>
      <stop offset="85%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2a4365"/>
    </linearGradient>

    <!-- Warm Golden Sunset Glow on Horizon -->
    <radialGradient id="horizonGlow" cx="65%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#f5ce62" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#c6a15b" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#0e7c7b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Highway Asphalt Gradient -->
    <linearGradient id="highwayAsphalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2636"/>
      <stop offset="100%" stop-color="#070d17"/>
    </linearGradient>

    <!-- Motion Light Streaks (Car Headlights / Taillights) -->
    <linearGradient id="headlightStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="taillightStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#fda4af" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Gold Grid Cyber Mesh -->
    <pattern id="dataGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#c6a15b" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>
  
  <!-- Horizon Sunset Radial Glow -->
  <rect width="1600" height="1000" fill="url(#horizonGlow)"/>

  <!-- Perspective Data Grid -->
  <rect width="1600" height="750" fill="url(#dataGrid)"/>

  <!-- Distant Mountain Ranges (Central Highlands Silhouette) -->
  <path d="M 0 650 Q 200 580, 450 630 T 900 610 T 1350 640 Q 1500 620, 1600 650 L 1600 750 L 0 750 Z" fill="#081424" opacity="0.7"/>
  <path d="M 0 680 Q 250 620, 550 660 T 1100 640 Q 1400 630, 1600 670 L 1600 750 L 0 750 Z" fill="#0c1e34" opacity="0.85"/>

  <!-- Colombo Lotus Tower Silhouette (Right Horizon) -->
  <g transform="translate(1120, 360)" opacity="0.75">
    <!-- Tower Stem -->
    <path d="M 46 400 L 48 180 L 52 180 L 54 400 Z" fill="#071220"/>
    <!-- Lotus Petal Bulb Base -->
    <path d="M 32 180 C 30 140, 70 140, 68 180 Z" fill="#881337"/>
    <!-- Lotus Petal Petals (Pink/Magenta Glow) -->
    <path d="M 24 150 C 20 100, 80 100, 76 150 Z" fill="#be123c" filter="drop-shadow(0 0 12px #e11d48)"/>
    <path d="M 32 135 C 32 90, 68 90, 68 135 Z" fill="#f43f5e"/>
    <!-- Spire Antenna -->
    <line x1="50" y1="90" x2="50" y2="0" stroke="#f5ce62" stroke-width="2.5"/>
    <circle cx="50" cy="5" r="4" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)"/>
  </g>

  <!-- Modern Transport Authority HQ Glass Complex (Right Center) -->
  <g transform="translate(820, 440)">
    <!-- Tower 1 -->
    <rect x="0" y="50" width="130" height="260" rx="4" fill="#09182b" stroke="#334155" stroke-width="1.5"/>
    <!-- Illuminated Glass Windows -->
    <g fill="#38bdf8" opacity="0.35">
      <rect x="15" y="70" width="18" height="8" rx="1"/>
      <rect x="45" y="70" width="18" height="8" rx="1"/>
      <rect x="75" y="70" width="18" height="8" rx="1"/>
      <rect x="15" y="95" width="18" height="8" rx="1"/>
      <rect x="75" y="95" width="18" height="8" rx="1" fill="#f5ce62" opacity="0.8"/>
      <rect x="15" y="120" width="18" height="8" rx="1"/>
      <rect x="45" y="120" width="18" height="8" rx="1"/>
      <rect x="75" y="145" width="18" height="8" rx="1"/>
      <rect x="45" y="170" width="18" height="8" rx="1" fill="#f5ce62" opacity="0.8"/>
      <rect x="15" y="195" width="18" height="8" rx="1"/>
      <rect x="75" y="195" width="18" height="8" rx="1"/>
    </g>
    <!-- Tower 2 (Main Curved Glass Atrium) -->
    <path d="M 140 0 C 190 0, 240 40, 250 310 L 140 310 Z" fill="#0d233a" stroke="#475569" stroke-width="1.5"/>
    <!-- Atrium Gold Accent Lines -->
    <line x1="140" y1="40" x2="210" y2="40" stroke="#c6a15b" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="100" x2="230" y2="100" stroke="#c6a15b" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="160" x2="242" y2="160" stroke="#c6a15b" stroke-width="2" opacity="0.6"/>
    <line x1="140" y1="220" x2="248" y2="220" stroke="#c6a15b" stroke-width="2" opacity="0.6"/>
    <!-- Rooftop Communication Mast -->
    <line x1="190" y1="0" x2="190" y2="-45" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="190" cy="-45" r="3.5" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
  </g>

  <!-- Modern Multi-Lane Express Highway & Flyover (Bottom Dynamic Sweep) -->
  <g id="highway">
    <!-- Elevated Flyover Concrete Ramp -->
    <path d="M 0 880 Q 400 700, 1000 680 L 1600 690 L 1600 750 L 1050 740 Q 420 760, 0 1000 Z" fill="#0b1726"/>
    <!-- Ground Highway Surface -->
    <path d="M 0 740 L 1600 710 L 1600 1000 L 0 1000 Z" fill="url(#highwayAsphalt)"/>
    <path d="M 0 740 L 1600 710" stroke="#c6a15b" stroke-width="3" opacity="0.4"/>

    <!-- Highway Lane Division Lines (Glowing White & Gold) -->
    <path d="M 0 850 Q 500 780, 1600 760" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="35 25" opacity="0.4"/>
    <path d="M 0 920 Q 550 840, 1600 820" fill="none" stroke="#c6a15b" stroke-width="5" stroke-dasharray="40 25" opacity="0.6"/>

    <!-- Light Trail Streaks: Forward Traffic (Headlights - White & Cyan) -->
    <path d="M 0 860 Q 600 790, 1600 770" fill="none" stroke="url(#headlightStreak)" stroke-width="8" filter="blur(2px)"/>
    <path d="M 0 860 Q 600 790, 1600 770" fill="none" stroke="#ffffff" stroke-width="3"/>
    
    <path d="M 0 880 Q 650 805, 1600 782" fill="none" stroke="url(#headlightStreak)" stroke-width="6" filter="blur(1px)"/>

    <!-- Light Trail Streaks: Oncoming / Outbound Traffic (Taillights - Crimson / Rose) -->
    <path d="M 1600 835 Q 700 860, 0 960" fill="none" stroke="url(#taillightStreak)" stroke-width="9" filter="blur(2px)"/>
    <path d="M 1600 835 Q 700 860, 0 960" fill="none" stroke="#fda4af" stroke-width="3.5"/>

    <path d="M 1600 855 Q 720 880, 0 985" fill="none" stroke="url(#taillightStreak)" stroke-width="7" filter="blur(1.5px)"/>
  </g>

  <!-- Subtle State Seal Ghost Watermark on Sky Left -->
  <g transform="translate(180, 160)" opacity="0.07">
    <circle cx="150" cy="150" r="140" fill="none" stroke="#c6a15b" stroke-width="8"/>
    <circle cx="150" cy="150" r="115" fill="none" stroke="#c6a15b" stroke-width="4"/>
  </g>
</svg>
