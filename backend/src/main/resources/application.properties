# Server Port (React runs on 5173, Spring Boot on 8080)
server.port=8080

# =====================================================
# MS SQL Server Connection
# IMPORTANT: Change the password below to YOUR actual SQL Server sa password
# =====================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=drivelink_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=2004
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
