# ─── Server ───────────────────────────────────────────────────────────────────
# Railway injects PORT automatically; fallback to 8080 for local dev
server.port=${PORT:8080}

# ─── Database (PostgreSQL on Railway) ─────────────────────────────────────────
# Railway auto-sets DATABASE_URL, PGUSER, PGPASSWORD when you add a PostgreSQL service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/drivelink_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" = Hibernate auto-creates/updates tables from JPA entities on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Cloudinary (cloud file uploads) ──────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:fz1srvv3}
cloudinary.api-key=${CLOUDINARY_API_KEY:441825253615924}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:HJYROLltIb01mJQUCtNS9orBkjU}

# ─── File Upload Limits ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
